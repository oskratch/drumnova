<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrumNova</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="drum-machine">

            <!-- ── Header Plate ─────────────────────────── -->
            <div class="header-plate">
                <div class="logo-section">
                    <div class="screw-row">
                        <span class="screw"></span>
                        <span class="screw"></span>
                    </div>
                    <h1 class="logo">DrumNova</h1>
                    <span class="logo-sub">DRUM MACHINE</span>
                </div>
                <div class="transport">
                    <button id="playBtn" class="btn-transport btn-play">&#9654; PLAY</button>
                    <button id="stopBtn" class="btn-transport btn-stop">&#9632; STOP</button>
                    <button id="clearBtn" class="btn-transport btn-clear">CLR</button>
                </div>
            </div>

            <!-- ── Controls Panel ───────────────────────── -->
            <div class="controls-panel">
                <div class="ctrl-group">
                    <span class="ctrl-label">BPM</span>
                    <span class="ctrl-value" id="bpmValue">120</span>
                    <input type="range" class="ctrl-slider" id="bpmSlider" min="60" max="200" value="120" step="1">
                </div>
                <div class="ctrl-sep"></div>
                <div class="ctrl-group">
                    <span class="ctrl-label">SWING</span>
                    <span class="ctrl-value" id="swingValue">0</span>
                    <input type="range" class="ctrl-slider" id="swingSlider" min="0" max="75" value="0" step="1">
                </div>
                <div class="ctrl-sep"></div>
                <div class="ctrl-group">
                    <span class="ctrl-label">REVERB</span>
                    <span class="ctrl-value" id="reverbValue">0</span>
                    <input type="range" class="ctrl-slider" id="reverbSend" min="0" max="100" value="0" step="1">
                </div>
                <div class="ctrl-sep"></div>
                <div class="ctrl-group ctrl-group--blocks">
                    <span class="ctrl-label">BLOCKS</span>
                    <div class="btn-row">
                        <button class="seg-btn block-btn active" data-blocks="1">1</button>
                        <button class="seg-btn block-btn" data-blocks="2">2</button>
                        <button class="seg-btn block-btn" data-blocks="4">4</button>
                        <button class="seg-btn block-btn" data-blocks="8">8</button>
                    </div>
                </div>
                <div class="ctrl-sep"></div>
                <div class="ctrl-group ctrl-group--view">
                    <span class="ctrl-label">VIEW</span>
                    <div class="btn-row">
                        <button class="seg-btn view-btn" data-view="1">1</button>
                        <button class="seg-btn view-btn active" data-view="2">2</button>
                        <button class="seg-btn view-btn" data-view="4">4</button>
                    </div>
                </div>
                <div class="ctrl-sep"></div>
                <div class="ctrl-nav">
                    <button id="prevBlock" class="nav-btn">&#9664;</button>
                    <span id="blockIndicator" class="block-indicator">1–2 / 1</span>
                    <button id="nextBlock" class="nav-btn">&#9654;</button>
                </div>
            </div>

            <!-- ── Pattern Bar ──────────────────────────── -->
            <div class="pattern-bar">
                <span class="ctrl-label">PATTERN</span>
                <select id="patternSelect" class="pattern-select">
                    <!-- Populated by JS -->
                </select>
                <button id="loadPattern" class="btn-bar">LOAD</button>
                <div class="bar-sep"></div>
                <button id="savePattern" class="btn-bar">SAVE</button>
                <button id="loadFile" class="btn-bar">OPEN</button>
                <input type="file" id="fileInput" accept=".json,.drumnova" style="display:none">
            </div>

            <!-- ── Mobile Channel Modal ──────────────────── -->
            <div id="channelModal" class="channel-modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3 id="modalChannelName">Channel Settings</h3>
                        <button class="modal-close">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="modal-row">
                            <label>Sound</label>
                            <select id="modalSoundSelector" class="sound-selector-modal"></select>
                        </div>
                        <button id="modalPreviewBtn" class="btn-modal-preview">&#9654; Preview</button>
                        <div class="modal-row">
                            <label>Mute</label>
                            <button id="modalMuteBtn" class="btn-modal-mute">&#128266;</button>
                        </div>
                        <div class="modal-row modal-row--col">
                            <label>Volume</label>
                            <input type="range" id="modalVolumeSlider" min="0" max="100" value="70" step="1">
                            <span id="modalVolumeValue">70%</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ── Sequencer ────────────────────────────── -->
            <div class="sequencer">

                <!-- Desktop channel labels -->
                <div class="channel-labels">
                    <div class="label-header">INSTRUMENT</div>

                    <div class="channel-label" data-channel="0">
                        <button class="mobile-settings-btn" data-channel="0" title="Settings">&#9881;</button>
                        <button class="preview-btn" data-channel="0" title="Preview">&#9654;</button>
                        <button class="mute-btn" data-channel="0" title="Mute">&#128266;</button>
                        <div class="vol-wrap">
                            <div class="volume-dial" data-channel="0" title="Volume">
                                <svg width="30" height="30" viewBox="0 0 30 30">
                                    <circle cx="15" cy="15" r="12" stroke-width="2"/>
                                    <line class="dial-indicator" x1="15" y1="15" x2="15" y2="5" stroke-width="2.5" stroke-linecap="round"/>
                                </svg>
                            </div>
                        </div>
                        <div class="label-content">
                            <span class="instrument-name">KICK</span>
                            <select class="sound-selector" data-channel="0">
                                <option value="kick">Kick 808</option>
                                <option value="kick2">Kick Vintage</option>
                                <option value="kick3">Kick Electro</option>
                                <option value="kick4">Kick Deep</option>
                                <option value="kick5">Kick Punchy</option>
                            </select>
                        </div>
                    </div>

                    <div class="channel-label" data-channel="1">
                        <button class="mobile-settings-btn" data-channel="1" title="Settings">&#9881;</button>
                        <button class="preview-btn" data-channel="1" title="Preview">&#9654;</button>
                        <button class="mute-btn" data-channel="1" title="Mute">&#128266;</button>
                        <div class="vol-wrap">
                            <div class="volume-dial" data-channel="1" title="Volume">
                                <svg width="30" height="30" viewBox="0 0 30 30">
                                    <circle cx="15" cy="15" r="12" stroke-width="2"/>
                                    <line class="dial-indicator" x1="15" y1="15" x2="15" y2="5" stroke-width="2.5" stroke-linecap="round"/>
                                </svg>
                            </div>
                        </div>
                        <div class="label-content">
                            <span class="instrument-name">SNARE</span>
                            <select class="sound-selector" data-channel="1">
                                <option value="snare">Snare 808</option>
                                <option value="snare2">Snare Vintage</option>
                                <option value="snare3">Snare Clap</option>
                                <option value="snare4">Snare Tight</option>
                                <option value="snare5">Snare Rimshot</option>
                            </select>
                        </div>
                    </div>

                    <div class="channel-label" data-channel="2">
                        <button class="mobile-settings-btn" data-channel="2" title="Settings">&#9881;</button>
                        <button class="preview-btn" data-channel="2" title="Preview">&#9654;</button>
                        <button class="mute-btn" data-channel="2" title="Mute">&#128266;</button>
                        <div class="vol-wrap">
                            <div class="volume-dial" data-channel="2" title="Volume">
                                <svg width="30" height="30" viewBox="0 0 30 30">
                                    <circle cx="15" cy="15" r="12" stroke-width="2"/>
                                    <line class="dial-indicator" x1="15" y1="15" x2="15" y2="5" stroke-width="2.5" stroke-linecap="round"/>
                                </svg>
                            </div>
                        </div>
                        <div class="label-content">
                            <span class="instrument-name">HIHAT</span>
                            <select class="sound-selector" data-channel="2">
                                <option value="hihat">HiHat Closed</option>
                                <option value="hihat2">HiHat Open</option>
                                <option value="hihat3">HiHat Pedal</option>
                                <option value="hihat4">HiHat Brush</option>
                                <option value="hihat5">HiHat 909</option>
                            </select>
                        </div>
                    </div>

                    <div class="channel-label" data-channel="3">
                        <button class="mobile-settings-btn" data-channel="3" title="Settings">&#9881;</button>
                        <button class="preview-btn" data-channel="3" title="Preview">&#9654;</button>
                        <button class="mute-btn" data-channel="3" title="Mute">&#128266;</button>
                        <div class="vol-wrap">
                            <div class="volume-dial" data-channel="3" title="Volume">
                                <svg width="30" height="30" viewBox="0 0 30 30">
                                    <circle cx="15" cy="15" r="12" stroke-width="2"/>
                                    <line class="dial-indicator" x1="15" y1="15" x2="15" y2="5" stroke-width="2.5" stroke-linecap="round"/>
                                </svg>
                            </div>
                        </div>
                        <div class="label-content">
                            <span class="instrument-name">CLAP</span>
                            <select class="sound-selector" data-channel="3">
                                <option value="clap">Clap Sharp</option>
                                <option value="clap2">Clap Room</option>
                                <option value="clap3">Clap Echo</option>
                                <option value="clap4">Clap Thick</option>
                                <option value="clap5">Clap Vintage</option>
                            </select>
                        </div>
                    </div>

                    <div class="channel-label" data-channel="4">
                        <button class="mobile-settings-btn" data-channel="4" title="Settings">&#9881;</button>
                        <button class="preview-btn" data-channel="4" title="Preview">&#9654;</button>
                        <button class="mute-btn" data-channel="4" title="Mute">&#128266;</button>
                        <div class="vol-wrap">
                            <div class="volume-dial" data-channel="4" title="Volume">
                                <svg width="30" height="30" viewBox="0 0 30 30">
                                    <circle cx="15" cy="15" r="12" stroke-width="2"/>
                                    <line class="dial-indicator" x1="15" y1="15" x2="15" y2="5" stroke-width="2.5" stroke-linecap="round"/>
                                </svg>
                            </div>
                        </div>
                        <div class="label-content">
                            <span class="instrument-name">TOM</span>
                            <select class="sound-selector" data-channel="4">
                                <option value="tom">Tom Low</option>
                                <option value="tom2">Tom Mid</option>
                                <option value="tom3">Tom High</option>
                                <option value="tom4">Tom Floor</option>
                            </select>
                        </div>
                    </div>

                    <div class="channel-label" data-channel="5">
                        <button class="mobile-settings-btn" data-channel="5" title="Settings">&#9881;</button>
                        <button class="preview-btn" data-channel="5" title="Preview">&#9654;</button>
                        <button class="mute-btn" data-channel="5" title="Mute">&#128266;</button>
                        <div class="vol-wrap">
                            <div class="volume-dial" data-channel="5" title="Volume">
                                <svg width="30" height="30" viewBox="0 0 30 30">
                                    <circle cx="15" cy="15" r="12" stroke-width="2"/>
                                    <line class="dial-indicator" x1="15" y1="15" x2="15" y2="5" stroke-width="2.5" stroke-linecap="round"/>
                                </svg>
                            </div>
                        </div>
                        <div class="label-content">
                            <span class="instrument-name">PERC</span>
                            <select class="sound-selector" data-channel="5">
                                <option value="perc">Perc Shaker</option>
                                <option value="perc2">Perc Cowbell</option>
                                <option value="perc3">Perc Conga</option>
                                <option value="perc4">Perc Woodblock</option>
                                <option value="perc5">Perc Tambourine</option>
                            </select>
                        </div>
                    </div>

                    <div class="channel-label" data-channel="6">
                        <button class="mobile-settings-btn" data-channel="6" title="Settings">&#9881;</button>
                        <button class="preview-btn" data-channel="6" title="Preview">&#9654;</button>
                        <button class="mute-btn" data-channel="6" title="Mute">&#128266;</button>
                        <div class="vol-wrap">
                            <div class="volume-dial" data-channel="6" title="Volume">
                                <svg width="30" height="30" viewBox="0 0 30 30">
                                    <circle cx="15" cy="15" r="12" stroke-width="2"/>
                                    <line class="dial-indicator" x1="15" y1="15" x2="15" y2="5" stroke-width="2.5" stroke-linecap="round"/>
                                </svg>
                            </div>
                        </div>
                        <div class="label-content">
                            <span class="instrument-name">CYMBAL</span>
                            <select class="sound-selector" data-channel="6">
                                <option value="cymbal">Cymbal Crash</option>
                                <option value="cymbal2">Cymbal Ride</option>
                                <option value="cymbal3">Cymbal China</option>
                                <option value="cymbal4">Cymbal Splash</option>
                            </select>
                        </div>
                    </div>

                    <div class="channel-label" data-channel="7">
                        <button class="mobile-settings-btn" data-channel="7" title="Settings">&#9881;</button>
                        <button class="preview-btn" data-channel="7" title="Preview">&#9654;</button>
                        <button class="mute-btn" data-channel="7" title="Mute">&#128266;</button>
                        <div class="vol-wrap">
                            <div class="volume-dial" data-channel="7" title="Volume">
                                <svg width="30" height="30" viewBox="0 0 30 30">
                                    <circle cx="15" cy="15" r="12" stroke-width="2"/>
                                    <line class="dial-indicator" x1="15" y1="15" x2="15" y2="5" stroke-width="2.5" stroke-linecap="round"/>
                                </svg>
                            </div>
                        </div>
                        <div class="label-content">
                            <span class="instrument-name">FX</span>
                            <select class="sound-selector" data-channel="7">
                                <option value="fx">FX Laser</option>
                                <option value="fx2">FX Sweep</option>
                                <option value="fx3">FX Stab</option>
                                <option value="fx4">FX Zap</option>
                                <option value="fx5">FX Bell</option>
                            </select>
                        </div>
                    </div>
                </div><!-- /.channel-labels -->

                <!-- Mobile settings column -->
                <div class="mobile-settings-column">
                    <div class="mobile-header"></div>
                    <button class="mobile-channel-btn" data-channel="0" title="Kick">&#9881;</button>
                    <button class="mobile-channel-btn" data-channel="1" title="Snare">&#9881;</button>
                    <button class="mobile-channel-btn" data-channel="2" title="HiHat">&#9881;</button>
                    <button class="mobile-channel-btn" data-channel="3" title="Clap">&#9881;</button>
                    <button class="mobile-channel-btn" data-channel="4" title="Tom">&#9881;</button>
                    <button class="mobile-channel-btn" data-channel="5" title="Perc">&#9881;</button>
                    <button class="mobile-channel-btn" data-channel="6" title="Cymbal">&#9881;</button>
                    <button class="mobile-channel-btn" data-channel="7" title="FX">&#9881;</button>
                </div>

                <!-- Grid -->
                <div class="grid-container">
                    <div class="step-indicators">
                        <div class="step-numbers"></div>
                    </div>
                    <div id="sequencerGrid" class="grid"></div>
                </div>

            </div><!-- /.sequencer -->

        </div><!-- /.drum-machine -->

        <footer class="footer">
            <p>Developed by <a href="https://oscarperiche.com" target="_blank">Oscar Periche</a></p>
        </footer>
    </div><!-- /.container -->

    <script src="patterns.js"></script>
    <script src="synthesis.js"></script>
    <script src="app.js"></script>
</body>
</html>
